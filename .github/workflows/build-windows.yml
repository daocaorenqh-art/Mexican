name: Build Windows Installer

# 手动触发，或推送 v* 标签（如 v0.2.0）时触发
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 安装依赖（含可选的原生数据库驱动，编译失败的会被跳过而不中断）
      - name: Install dependencies
        run: npm install

      # 编码器正确性校验：生成的二维码/DataMatrix 必须能被独立解码器扫回原文，否则不出包
      - name: Verify barcode encoders
        run: npm test

      # 用 electron-builder 打包成 NSIS 安装程序
      - name: Build installer
        run: npm run dist

      # 核查安装包里 5 个数据库驱动都在：原生驱动查 .node 文件，纯 JS 驱动查 app.asar 内容
      - name: Verify packaged database drivers
        shell: pwsh
        run: |
          $base = 'dist/win-unpacked/resources/app.asar.unpacked/node_modules'
          foreach ($m in @('better-sqlite3', 'odbc')) {
            $n = Get-ChildItem -Path (Join-Path $base $m) -Recurse -Filter *.node -ErrorAction SilentlyContinue
            if (-not $n) { Write-Error "安装包缺少原生驱动：$m"; exit 1 }
            Write-Host "OK  $m  ->  $($n[0].Name)"
          }
          node -e "const a=require('@electron/asar');const l=a.listPackage('dist/win-unpacked/resources/app.asar').join('\n');for(const m of ['mysql2','pg','mssql']){if(!new RegExp('node_modules[\\\\/]'+m+'[\\\\/]package\\.json').test(l)){console.error('安装包缺少驱动：'+m);process.exit(1)}console.log('OK  '+m)}"

      # 把安装包作为构建产物上传（在 Actions 运行页可下载）
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: label-print-tool-windows
          path: |
            dist/*.exe
            dist/*.blockmap

      # 打了 v* 标签时，额外发布一个 Release 并附上安装包，供直接下载
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
