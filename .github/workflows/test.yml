name: Test

# 每次推送 / PR 自动跑：
# - 单元测试（编码器扫码校验、表达式、预检、ZPL/TSPL 点阵扫码、数据来源、直发），Ubuntu + Windows
#   （Windows 额外验证共享打印机 / 按打印机名 RAW 直发的 Windows 专用代码能运行）
# - 界面与打印端到端测试（Playwright；独立斑马渲染器出纸 + 扫码校验），Ubuntu
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # 单元测试不需要 Electron 和原生驱动编译，跳过安装脚本
      - run: npm ci --ignore-scripts
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 中文字体（标签预览与栅格化要用）
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - run: npm ci --ignore-scripts

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_OUT: ${{ runner.temp }}/label-e2e

      # 桌面版端到端：下载 Electron 本体，在虚拟显示器里启动整个应用，连模拟的网络标签机走「检测 → 分批直发」
      - name: Desktop end-to-end test
        run: |
          node node_modules/electron/install.js
          xvfb-run -a npm run test:desktop

      # 失败时把截图、生成的 ZPL 和渲染图传上来便于排查
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: ${{ runner.temp }}/label-e2e/out
