name: Test

# 每次推送和 PR 都跑全部测试（编码器扫码校验、表达式、预检、ZPL 点阵扫码、数据来源、直发）
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # 测试不需要 Electron 和原生数据库驱动，跳过安装脚本
      - run: npm ci --ignore-scripts
      - run: npm test
